max_cards: 100
attempts: 2
doubao:
  url: https://www.doubao.com/chat/
  timeout: 120
  input: 'css:[data-testid="chat_input_input"] [contenteditable="true"]'
  send: 'css:[data-testid="chat_input_send_button"]'
  answer: 'css:[data-testid="message_text_content"]'
  generating: 'css:[data-testid="chat_stop_button"]'
  failed: 'css:[data-testid="message_box_failed_icon"]'
  new_chat: 'xpath://div[@role="button"][starts-with(normalize-space(.), "新对话")]'
  authenticated: 'css:[data-sidebar-footer-account-menu] [data-testid="chat_header_avatar_button"]'
