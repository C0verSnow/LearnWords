name: Probe Doubao session
on:
  workflow_dispatch:
    inputs:
      session_mode:
        description: Session restore experiment (empty uses repository variable)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SESSION_MODE: ${{ inputs.session_mode || vars.SESSION_MODE || 'none' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SESSION_BUCKET: ${{ vars.SUPABASE_SESSION_BUCKET || 'browser-sessions' }}
      SUPABASE_SESSION_OBJECT: ${{ vars.SUPABASE_SESSION_OBJECT || 'doubao.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: python -m scripts.session probe
