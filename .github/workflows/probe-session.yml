name: Probe browser access and session
run-name: probe-${{ inputs.target || 'session' }}-${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Network only, restore and query Doubao, or encrypt the existing legacy profile
        type: choice
        options: [session, network, migrate]
        default: session
      session_mode:
        description: Session restore experiment (empty uses repository variable)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
      TS_EXPECTED_IPV4: ${{ vars.TS_EXPECTED_IPV4 }}
      TS_EXPECTED_IPV6: ${{ vars.TS_EXPECTED_IPV6 }}
      BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
      SESSION_MODE: ${{ inputs.session_mode || vars.SESSION_MODE || 'profile' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SESSION_BUCKET: ${{ vars.SUPABASE_SESSION_BUCKET || 'browser-sessions' }}
      SUPABASE_SESSION_OBJECT: doubao.json
      SUPABASE_PROFILE_OBJECT: doubao-profile.tar.gz.fernet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check virtual display for headed Chrome
        run: command -v xvfb-run
      - uses: ./.github/actions/tailscale-exit
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.TS_OAUTH_SECRET }}
          exit-node: ${{ vars.TS_EXIT_NODE }}
      - name: Encrypt the legacy profile without opening Chrome
        if: inputs.target == 'migrate'
        run: python -m scripts.session migrate
      - name: Probe Doubao session
        if: inputs.target == 'session'
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m scripts.session probe
      - name: Restore runner routing and remove private working files
        if: always()
        run: |
          sudo tailscale set --exit-node= || true
          pkill -x chrome || true
          rm -rf .session
