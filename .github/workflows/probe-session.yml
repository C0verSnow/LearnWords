name: Probe browser access and session
run-name: probe-${{ inputs.target || 'session' }}-${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Restore and query DeepSeek, or inspect page access only
        type: choice
        options: [session, access]
        default: session
      session_mode:
        description: Session restore experiment (empty uses repository variable)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIHOMO_TUN: '1'
      SESSION_MODE: ${{ inputs.session_mode || vars.SESSION_MODE || 'profile' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SESSION_BUCKET: ${{ vars.SUPABASE_SESSION_BUCKET || 'browser-sessions' }}
      SUPABASE_SESSION_OBJECT: deepseek.json
      SUPABASE_PROFILE_OBJECT: deepseek-profile.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Start private Hong Kong proxy
        run: python -m scripts.mihomo
      - name: Probe DeepSeek session
        if: inputs.target != 'access'
        run: python -m scripts.session probe
      - name: Inspect DeepSeek page access
        if: inputs.target == 'access'
        run: python -m scripts.probe_deepseek
      - name: Stop TUN before runner cleanup
        if: always()
        run: sudo pkill -x mihomo || true
