name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check virtual display for headed Chrome
        run: command -v xvfb-run
      - run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m unittest discover -s tests -v
