name: Make cards
run-name: make-${{ inputs.request_id || github.run_id }} chat-${{ inputs.chat_id }}

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of cards (1–100)
        required: true
        default: '20'
      mode:
        description: Word selection
        type: choice
        options: [next, random]
        default: next
      request_id:
        description: Original task ID for recovery (empty for a new task)
        default: ''
      chat_id:
        description: Telegram private chat ID (optional for manual runs)
        default: ''

permissions:
  contents: write

concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          environment: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: ${{ secrets.INFISICAL_SECRET_PATH }}
          api-url: ${{ vars.INFISICAL_API_URL }}
      - name: Install Chrome, speech engine and Python dependencies
        run: |
          bash scripts/install_runner_packages.sh espeak-ng
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          python -m pip install -r requirements-worker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check virtual display for headed Chrome
        run: command -v xvfb-run
      - uses: ./.github/actions/tailscale-doubao
        with:
          client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          client-secret: ${{ env.TS_OAUTH_SECRET }}
          exit-node: ${{ env.TS_EXIT_NODE }}
      - name: Generate, checkpoint, publish and notify
        env:
          COUNT: ${{ inputs.count }}
          MODE: ${{ inputs.mode }}
          REQUEST_ID: ${{ inputs.request_id || format('run-{0}', github.run_id) }}
          CHAT_ID: ${{ inputs.chat_id || env.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m src.main --count "$COUNT" --mode "$MODE" --request-id "$REQUEST_ID" --chat-id "$CHAT_ID"
      - name: Restore runner routing and remove private working files
        if: always()
        run: |
          pkill -x chrome || true
          python -m scripts.tailscale_split stop || true
          rm -rf .session
      - name: Preserve products and recovery data even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnword-${{ github.run_id }}
          path: |
            output/
            docs/explanations/
            docs/manifests/
            docs/records/
          if-no-files-found: ignore
          retention-days: 14
