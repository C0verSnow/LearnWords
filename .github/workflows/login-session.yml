name: Login Doubao session
on:
  workflow_dispatch:
    inputs:
      login_id:
        description: Private login control identifier; leave empty to inspect only
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
      TS_EXPECTED_IPV4: ${{ vars.TS_EXPECTED_IPV4 }}
      TS_EXPECTED_IPV6: ${{ vars.TS_EXPECTED_IPV6 }}
      BROWSER_PROFILE_KEY: ${{ secrets.BROWSER_PROFILE_KEY }}
      LOGIN_ID: ${{ inputs.login_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SESSION_BUCKET: ${{ vars.SUPABASE_SESSION_BUCKET || 'browser-sessions' }}
      SUPABASE_SESSION_OBJECT: doubao.json
      SUPABASE_PROFILE_OBJECT: doubao-profile.tar.gz.enc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check virtual display for headed Chrome
        run: command -v xvfb-run
      - uses: ./.github/actions/tailscale-doubao
        with:
          client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          client-secret: ${{ secrets.TS_OAUTH_SECRET }}
          exit-node: ${{ vars.TS_EXIT_NODE }}
      - run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m scripts.remote_login
      - name: Restore runner routing and remove private working files
        if: always()
        run: |
          python -m scripts.tailscale_split stop || true
          pkill -x chrome || true
          rm -rf .session
