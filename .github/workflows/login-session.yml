name: Login DeepSeek session
on:
  workflow_dispatch:
    inputs:
      hk_node:
        description: Hong Kong candidate index (0 selects the first usable node)
        type: number
        default: 0
      login_id:
        description: Private login control identifier; leave empty to inspect only
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIHOMO_TUN: '1'
      MIHOMO_HK_INDEX: ${{ inputs.hk_node || '0' }}
      LOGIN_ID: ${{ inputs.login_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SESSION_BUCKET: ${{ vars.SUPABASE_SESSION_BUCKET || 'browser-sessions' }}
      SUPABASE_SESSION_OBJECT: deepseek.json
      SUPABASE_PROFILE_OBJECT: deepseek-profile.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Start private Hong Kong proxy
        run: python -m scripts.mihomo
      - run: python -m scripts.remote_login
      - name: Stop TUN before runner cleanup
        if: always()
        run: sudo pkill -x mihomo || true
