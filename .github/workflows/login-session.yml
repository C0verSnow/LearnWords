name: Login Doubao session
on:
  workflow_dispatch:
    inputs:
      login_id:
        description: Private login control identifier; leave empty to inspect only
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: learnword-card-records
  cancel-in-progress: false
  queue: max
jobs:
  login:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOGIN_ID: ${{ inputs.login_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          environment: ${{ vars.INFISICAL_ENVIRONMENT }}
          secret-path: ${{ secrets.INFISICAL_SECRET_PATH }}
          api-url: ${{ vars.INFISICAL_API_URL }}
      - run: |
          python -m pip install -r requirements-worker.txt
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check virtual display for headed Chrome
        run: command -v xvfb-run
      - uses: ./.github/actions/tailscale-doubao
        with:
          client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          client-secret: ${{ env.TS_OAUTH_SECRET }}
          exit-node: ${{ env.TS_EXIT_NODE }}
      - run: xvfb-run -a --server-args="-screen 0 1440x1000x24" python -m scripts.remote_login
      - name: Restore runner routing and remove private working files
        if: always()
        run: |
          pkill -x chrome || true
          python -m scripts.tailscale_split stop || true
          rm -rf .session
